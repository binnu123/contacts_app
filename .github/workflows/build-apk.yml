name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Ensure Flutter project exists (create if missing)
        run: |
          if [ ! -d "android" ]; then
            echo "android folder missing — running flutter create . to generate project skeleton"
            flutter create .
          else
            echo "android folder found, skipping flutter create"
          fi

      - name: Install Android SDK components
        run: |
          sudo apt-get update
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Get dependencies
        run: flutter pub get

      - name: Restore signing keystore (if provided)
        run: |
          # If ANDROID_KEYSTORE_BASE64 is non-empty, decode it and move to $HOME/.android/key.jks
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Keystore secret detected — restoring keystore"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/keystore.jks
            mkdir -p $HOME/.android
            mv /tmp/keystore.jks $HOME/.android/key.jks
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret provided — skipping keystore restore"
          fi

      - name: Create android/key.properties (if keystore present)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Creating android/key.properties from secrets"
            cat > android/key.properties <<EOF
storeFile=$HOME/.android/key.jks
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
keyPassword=${{ secrets.KEY_PASSWORD }}
EOF
            echo "key.properties created"
          else
            echo "No keystore secret — skipping key.properties creation"
          fi

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
